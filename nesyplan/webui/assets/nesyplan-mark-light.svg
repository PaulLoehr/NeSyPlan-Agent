<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92">
  <!-- NeSyPlan mark: three cubes stacked with support -- the domain in one glyph.
       Single-colour on purpose: style.css uses it as a MASK and paints it with the
       theme's text colour, so one file serves both light and dark. -->
  <g fill="#f5f5f5">
    <rect x="4"  y="52" width="36" height="36" rx="4"/>
    <rect x="44" y="52" width="36" height="36" rx="4"/>
    <rect x="24" y="12" width="36" height="36" rx="4"/>
  </g>
</svg>
